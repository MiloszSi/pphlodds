name: Update PPHL Playoff Odds

on:
  schedule:
    # Every 6 hours. Cron is UTC. Change the "*/6" to adjust frequency
    # (e.g. "0 */3 * * *" for every 3 hours, "0 12 * * *" for once daily at noon UTC).
    - cron: '0 */6 * * *'
  workflow_dispatch: {}   # lets you trigger a run manually from the Actions tab

permissions:
  contents: write   # needed so the workflow can commit the updated HTML back

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install openpyxl

      - name: Regenerate odds data from the live mastersheets
        run: |
          python generate_pphl_data.py \
            --premier "https://docs.google.com/spreadsheets/d/1mRoiVjKpYc474RWZpE_DCbNM37Lz4ehg6o0YKI9y5aw/edit" \
            --challenger "https://docs.google.com/spreadsheets/d/1ourojOrP-vT8Lolfy_FirqFBGGtMaUrYYbAa6wgUvWg/edit" \
            --html pphl_playoff_odds_full.html

      - name: Commit and push if anything changed
        run: |
          git config user.name "pphl-odds-bot"
          git config user.email "actions@github.com"
          git add pphl_playoff_odds_full.html team_meta.json
          git diff --staged --quiet || git commit -m "Auto-update playoff odds data"
          git push
